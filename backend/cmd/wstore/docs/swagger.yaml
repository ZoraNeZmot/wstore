basePath: /api/
definitions:
  authhandlers.EmailRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  response.ErrorDTO:
    properties:
      error:
        $ref: '#/definitions/response.ResponseError'
      success:
        type: boolean
    type: object
  response.FlagDTO:
    properties:
      success:
        type: boolean
    type: object
  response.MessageDTO:
    properties:
      data:
        properties:
          message:
            type: string
        type: object
      success:
        type: boolean
    type: object
  response.ResponseError:
    properties:
      code:
        example: 400
        type: integer
      details: {}
      message:
        example: Validation failed
        type: string
    type: object
  response.TokenDTO:
    properties:
      data:
        properties:
          accessToken:
            type: string
        type: object
      success:
        type: boolean
    type: object
  response.UserDTO:
    properties:
      data:
        $ref: '#/definitions/response.UserResponse'
      success:
        type: boolean
    type: object
  response.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  response.UsersListDTO:
    properties:
      data:
        properties:
          users:
            items:
              $ref: '#/definitions/response.UserResponse'
            type: array
        type: object
      success:
        type: boolean
    type: object
info:
  contact:
    email: kureichukns@gmail.com
    name: API Supports
  description: WStore API. Response model is struct{Success bool, Data any, Error
    *ResponseError}. Only success flag is obligatory.
  license:
    name: Apache 2.0
    url: api/license.txt
  title: WStore API
  version: "1.0"
paths:
  /auth/email/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authhandlers.EmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorDTO'
      summary: Email login
      tags:
      - auth
  /auth/email/signup:
    post:
      consumes:
      - application/json
      description: Signup with email and password
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authhandlers.EmailRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.MessageDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorDTO'
      summary: Email signup
      tags:
      - auth
  /auth/logout:
    post:
      description: Logout the user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FlagDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorDTO'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    get:
      description: Refresh token. Can't be executed in Swagger UI.
      parameters:
      - description: 'Refresh token (format: RefreshToken=YOUR_TOKEN)'
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorDTO'
      summary: Refresh token
      tags:
      - auth
  /service/authtest:
    get:
      description: Test if the user is authorized
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FlagDTO'
      security:
      - Bearer: []
      summary: Auth test
      tags:
      - service
  /service/health:
    get:
      description: Check if the server is running
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FlagDTO'
      summary: Health check
      tags:
      - service
  /user/{id}:
    get:
      consumes:
      - application/json
      description: Get user by id or me
      parameters:
      - description: User UUID or me for the current user
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorDTO'
      security:
      - Bearer: []
      summary: Get user
      tags:
      - user
  /user/profile-image/{id}:
    get:
      consumes:
      - application/json
      description: Get user profile image by id or me
      parameters:
      - description: User UUID or me for the current user
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: binary
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorDTO'
      security:
      - Bearer: []
      summary: Get user profile image
      tags:
      - user
  /users:
    get:
      consumes:
      - application/json
      description: Get users list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UsersListDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorDTO'
      security:
      - Bearer: []
      summary: Get users list
      tags:
      - user
schemes:
- https
- http
securityDefinitions:
  Bearer:
    description: Type "Bearer " followed by your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
