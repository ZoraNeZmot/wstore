basePath: /api
definitions:
  authhandlers.EmailRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  response.FlagDTO:
    properties:
      success:
        type: boolean
    type: object
  response.MessageResponse:
    properties:
      message:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ResponseError'
      success:
        type: boolean
    type: object
  response.ResponseError:
    properties:
      code:
        type: integer
      details: {}
      message:
        type: string
    type: object
host: localhost:8443
info:
  contact:
    email: kureichukns@gmail.com
    name: API Supports
  description: WStore API
  license:
    name: Apache 2.0
    url: api/license.txt
  title: WStore API
  version: "1.0"
paths:
  /auth/email/login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authhandlers.EmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Email login
      tags:
      - auth
  /auth/email/signup:
    post:
      consumes:
      - application/json
      description: Signup with email and password
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authhandlers.EmailRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.MessageResponse'
                error: {}
              type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Email signup
      tags:
      - auth
  /service/authtest:
    get:
      description: Test if the user is authorized
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FlagDTO'
      security:
      - Bearer: []
      summary: Auth test
      tags:
      - service
  /service/health:
    get:
      description: Check if the server is running
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FlagDTO'
      summary: Health check
      tags:
      - service
schemes:
- https
- http
swagger: "2.0"
